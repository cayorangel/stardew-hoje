<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Testes do planejador</title>
<style>
  body{font:15px/1.45 system-ui,sans-serif;margin:16px;background:#fff;color:#1b1b1b}
  @media (prefers-color-scheme:dark){body{background:#151515;color:#eee}}
  #total{font-weight:700;margin:8px 0 12px}
  .ok{color:#2e7d32}.falha{color:#c62828}.pulado{color:#888}
  li{margin:2px 0}
  iframe{width:100%;height:300px;border:1px solid #8884;margin-top:16px;pointer-events:none} /* só para ver: o app de teste não recebe toques */
</style>
</head>
<body>
<h1>Testes do planejador</h1>
<p>Esta página abre o app em modo teste (nada é salvo nem sincronizado) e confere o comportamento. Ela não faz parte do app.</p>
<div id="total">Rodando…</div>
<ol id="lista"></ol>
<iframe id="app" title="App em modo teste"></iframe>
<script>
// ---------- Executor ----------
const TESTES=[];
const NO_PC=['localhost','127.0.0.1'].includes(location.hostname);
function teste(nome,fn,opts={}){ TESTES.push({nome,fn,opts}); }
function ok(cond,msg){ if(!cond) throw new Error(msg||'condição falsa'); }
function igual(a,b,msg){ if(a!==b) throw new Error((msg||'diferente')+` (esperado ${JSON.stringify(b)}, veio ${JSON.stringify(a)})`); }
const espera=ms=>new Promise(r=>setTimeout(r,ms));
function abrirApp(){
  return new Promise(res=>{ const f=document.getElementById('app'); f.onload=()=>res(f.contentWindow); f.src='index.html?teste=1&r='+Date.now(); });
}
function mesclar(a,b){ for(const k in b){ const v=b[k]; if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) mesclar(a[k],v); else a[k]=v; } return a; }
// Estado limpo + patch, aplicado no app
function estado(app,patch={}){
  const s=app.eval('normalize')({example:false});
  mesclar(s,JSON.parse(JSON.stringify(patch)));
  app.eval('(x=>{ st=x; st.frozen=null; commit(); })')(s);
  return app.eval('st');
}
// Tarefas do dia, achatadas
function plano(app){
  const p=app.eval('buildPlan')();
  const todas=[...(p.tasks||[]), ...((p.perPlayer||[]).flat()), ...((p.missions||[]).filter(Boolean).flatMap(m=>m.tasks||[]))];
  const vistos=new Set(), out=[];
  todas.forEach(t=>{ if(typeof t==='string') t={id:'',t}; const k=t.id?String(t.id).replace(/^m\d-/,''):'|'+t.t; if(vistos.has(k)) return; vistos.add(k); out.push({id:String(t.id||''),t:String(t.t||''),d:String(t.d||'')}); });
  return out;
}
const temId=(app,re)=>plano(app).some(t=>re.test(t.id));

// ---------- Tarefa 1: modo teste ----------
const LS='sdv-hoje-v1', SYNC='sdv-hoje-v1-sync';
teste('modo teste não toca no localStorage', async ()=>{
  const antes=localStorage.getItem(LS);
  localStorage.setItem(LS,'SENTINELA');
  try{
    const app=await abrirApp();
    estado(app,{year:1,season:0,day:5});
    app.eval('commit')();
    igual(localStorage.getItem(LS),'SENTINELA','o app gravou no localStorage');
  } finally { if(antes===null) localStorage.removeItem(LS); else localStorage.setItem(LS,antes); }
},{soPC:true});
teste('modo teste não sincroniza', async ()=>{
  const antes=localStorage.getItem(SYNC);
  localStorage.setItem(SYNC,'TESTE-0000-0000');
  try{
    const app=await abrirApp();
    await espera(1500);
    const rede=app.performance.getEntriesByType('resource').map(e=>e.name).filter(n=>/firebase|firestore/.test(n));
    igual(rede.length,0,'o app tentou falar com o Firebase: '+rede.join(', '));
  } finally { if(antes===null) localStorage.removeItem(SYNC); else localStorage.setItem(SYNC,antes); }
},{soPC:true});
teste('estado antigo carrega', async app=>{
  const s=app.eval('normalize')({players:[{tools:{rod:3}},{}],owned:{silo:'have'}});
  igual(s.players[0].tools.rod,3,'vara do jogador 1');
});
teste('plano de base gera tarefas', async app=>{
  estado(app,{year:1,season:0,day:5});
  ok(plano(app).length>0,'plano vazio');
});

// ---------- Estado de "fim de jogo": tudo comprado e liberado; cada teste tira só o que testa ----------
function fimDeJogo(app,extra={}){
  const owned={}; app.eval('BUILD').forEach(b=>owned[b.id]='have');
  app.eval('TREES').forEach(t=>owned['tree-'+t.id]='have');
  const animals={}; app.eval('ANIMALS').forEach(a=>animals[a.id]=true);
  const cc={}; app.eval('ROOMS').forEach(r=>r.bundles.forEach(b=>b.items.forEach((_,i)=>cc[b.id+':'+i]=true)));
  const tools={}; app.eval('TOOLS').forEach(([k,l,lv])=>tools[k]=lv.length-1);
  const pl=n=>({name:n,farming:10,mining:10,foraging:10,fishing:10,combat:10,tools:{...tools},pw:{masteryFarming:true,masteryMining:true,masteryFishing:true,shortsRod:true}});
  const base={year:3,season:0,day:11,weather:'sol',luck:'0',mine:120,owned,animals,cc,
    players:[pl('Jogador 1'),pl('Jogador 2')],
    farm:{coopLv:3,barnLv:3,houseLv:3,shedLv:2,furnace:true,sprinklers:true,silo:true,greenhouse:true,crops:'muitas',cave:'cogumelos'},
    unl:{cc:true,beach:true,woods:true,bus:true,minecart:true,quarry:true,skull:true,island:true},
    quests:{talisman:true,goblin:true},special:{rusty:true,skullkey:true}};
  return estado(app,mesclar(base,extra));
}
const ids=(app,re)=>plano(app).filter(t=>re.test(t.id)).map(t=>t.id);

// Muda o estado atual do app e recalcula
function ajusta(app,fn){ const s=app.eval('st'); fn(s); s.frozen=null; app.eval('commit')(); }
const tarefa=(app,id)=>plano(app).find(t=>t.id===id);

  const en=new Set(app.eval('BUILD').map(b=>b.en));
  ['Mayonnaise Machine','Bee House','Preserves Jar','Cheese Press','Loom','Keg','Oil Maker','Cask','Fish Smoker','Dehydrator','Charcoal Kiln','Crystalarium','Heavy Furnace','Lightning Rod','Solar Panel','Recycling Machine','Seed Maker','Slime Incubator','Ostrich Incubator','Slime Egg-Press','Tapper','Heavy Tapper','Worm Bin','Deluxe Worm Bin','Bone Mill','Geode Crusher','Mushroom Log','Bait Maker'].forEach(n=>ok(en.has(n),'falta '+n));
});
const SO={owned:{geodeCrusher:'want',boneMill:'want',solar:'want'},unl:{island:false}};
teste('quadro na segunda', async app=>{

  ok(/Patrulha da Caverna/.test(t.d)&&/Fragmentos do Passado/.test(t.d),'faltam pedidos: '+t.d);
  ok(!/Ingredientes da Ilha/.test(t.d),'Ingredientes da Ilha sem a ilha');
  ajusta(app,s=>s.unl.island=true);

});

});

});

});

// ---------- Tarefa 6: contadores ----------
const resumo=(app,id)=>(app.document.querySelector(`[data-sec="${id}"] .sum`)||{}).textContent||'';
teste('resumo de construções', async app=>{
  // O Centro completo do fim de jogo marca as recompensas como "Já temos"; por isso compara antes e depois
  const owned={}; app.eval('BUILD').forEach(b=>owned[b.id]='want');
  fimDeJogo(app,{owned});
  const total=app.eval('BUILD').filter(b=>b.id!=='coop'&&b.id!=='barn').length;
  const m=resumo(app,'build').match(/^(\d+) de (\d+)$/); ok(m,'formato: '+resumo(app,'build'));
  igual(+m[2],total,'total do catálogo');
  ajusta(app,s=>s.owned.clock='have');
  igual(+resumo(app,'build').match(/^(\d+)/)[1],+m[1]+1,'não contou o item marcado');
});

});
teste('resumo de animais', async app=>{

  ok(/12 de 12/.test(resumo(app,'anim')),'resumo: '+resumo(app,'anim'));
});

// ---------- Revisão final: correções ----------
teste('modo teste isola armazenamento e sincronização', async ()=>{
  const antes=localStorage.getItem(SYNC);
  const app=await abrirApp();
  try{
    app.localStorage.setItem(SYNC,'VAZOU'); app.sessionStorage.setItem('sdv-hoje-v1-tab','VAZOU');
    igual(localStorage.getItem(SYNC),antes,'o iframe gravou o código de sincronização real');
    const r=await app.eval('syncStart')('TESTE-1111-1111','join');
    await espera(800);
    const rede=app.performance.getEntriesByType('resource').map(e=>e.name).filter(n=>/firebase|firestore/.test(n));
    igual(rede.length,0,'syncStart falou com o Firebase');
  } finally { if(localStorage.getItem(SYNC)!==antes){ if(antes===null) localStorage.removeItem(SYNC); else localStorage.setItem(SYNC,antes); } }
},{soPC:true});
teste('app de teste não recebe toques', async ()=>{
  igual(getComputedStyle(document.getElementById('app')).pointerEvents,'none','iframe aceita toques');
});
teste('coleção muda de um dia para o outro', async app=>{

  const a=ids(app,/^col-/)[0];
  ajusta(app,s=>s.day=12);
  const b=ids(app,/^col-/)[0];
  ok(a&&b&&a!==b,`mesma coleção nos dois dias: ${a} / ${b}`);
});

});

  igual(ids(app,/chickenGold|autoPet/).length,0,'apareceu');
});
teste('passo da missão grava ao marcar', async app=>{

// ---------- Rodar ----------
(async function rodar(){
  const lista=document.getElementById('lista'); let pass=0, run=0, pul=0;
  let app=await abrirApp();
  for(const t of TESTES){
    const li=document.createElement('li'); lista.appendChild(li);
    if(t.opts.soPC && !NO_PC){ pul++; li.className='pulado'; li.textContent=`pulado (só no computador): ${t.nome}`; continue; }
    run++;
    try{ await t.fn(app); pass++; li.className='ok'; li.textContent='ok: '+t.nome; }
    catch(e){ li.className='falha'; li.textContent=`FALHA: ${t.nome} — ${e.message}`; }
    if(t.opts.soPC) app=await abrirApp();
  }
  const el=document.getElementById('total');
  el.textContent=`TOTAL: ${pass} de ${run}${pul?` (${pul} pulados)`:''} — ${pass===run?'tudo ok':'FALHAS'}`;
  el.className=pass===run?'ok':'falha';
})();
</script>
