<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stardew Hoje">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>O Que Fazer Hoje em Stardew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: almanaque da fazenda. Faixa de data no topo, plano do dia à esquerda, caderno da fazenda à direita (abas no celular). */
:root{
  --bg:#EAF0E1; --panel:#FAFCF5; --panel2:#F1F5EA; --ink:#1D2A1F; --muted:#5A6A5B; --line:#CAD6BF;
  --accent:#2E6B3A; --accent-ink:#FFFFFF; --gold:#B87A06; --gold-soft:#F6E7BF; --berry:#A3305A; --berry-soft:#F5DCE5;
  --sky:#2D6AA3; --sky-soft:#DCE8F4; --ok:#2E7D46;
  --s0:#4A9440; --s1:#C88A0C; --s2:#BE561E; --s3:#3C74A4;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --panel:#19221C; --panel2:#1F2A22; --ink:#E2EADC; --muted:#9BAB99; --line:#2D3B31;
  --accent:#6DC27B; --accent-ink:#0E1A11; --gold:#F0B53A; --gold-soft:#3A2F15; --berry:#E9799F; --berry-soft:#3A1E29;
  --sky:#7DB2E4; --sky-soft:#1B2C3C; --ok:#6DC27B;
  --s0:#7CC46F; --s1:#F0B53A; --s2:#EE8A52; --s3:#7DB2E4; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111813; --panel:#19221C; --panel2:#1F2A22; --ink:#E2EADC; --muted:#9BAB99; --line:#2D3B31;
  --accent:#6DC27B; --accent-ink:#0E1A11; --gold:#F0B53A; --gold-soft:#3A2F15; --berry:#E9799F; --berry-soft:#3A1E29;
  --sky:#7DB2E4; --sky-soft:#1B2C3C; --ok:#6DC27B;
  --s0:#7CC46F; --s1:#F0B53A; --s2:#EE8A52; --s3:#7DB2E4; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.2rem}
h3{font-size:1rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.en{color:var(--muted);font-size:.78em}

/* Faixa de data */
.dateband{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;
  border-top:6px solid var(--season)}
.datebig{display:flex;flex-direction:column;gap:2px;min-width:0}
.datebig .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.datebig h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.05;color:var(--season)}
.datebig .sub{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.daypick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1 1 360px;max-width:520px;min-width:0}
.pick{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 8px;min-width:0;cursor:pointer}
.pick span{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick select{-webkit-appearance:none;appearance:none;border:0;background:transparent;font-size:16px;font-weight:700;padding:0 14px 0 0;width:100%;min-width:0;color:inherit;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.pick.rain{background:var(--sky-soft);border-color:transparent}.pick.rain select{color:var(--sky)}
.pick.luckg{background:var(--gold-soft);border-color:transparent}.pick.luckg select{color:var(--gold)}
.pick.luckb{background:var(--berry-soft);border-color:transparent}.pick.luckb select{color:var(--berry)}
.pick.todo{border:1.5px dashed var(--gold)}
@media (max-width:620px){.daypick{flex-basis:100%;max-width:none;gap:6px}.pick{padding:6px 6px 6px 8px}.pick select{font-size:16px;font-weight:600;letter-spacing:-.01em;padding-right:0;background-image:none}.dateband{padding:12px}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:5px 11px;border-radius:999px;font-size:.88rem;font-weight:600;white-space:nowrap}
.chip.rain{background:var(--sky-soft);border-color:transparent;color:var(--sky)}
.chip.fest{background:var(--berry-soft);border-color:transparent;color:var(--berry)}
.chip.luckg{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.chip.luckb{background:var(--berry-soft);border-color:transparent;color:var(--berry)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.banner{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--gold)}

/* Abas (só celular) */
.tabs{display:none;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex}
  .grid[data-tab="plano"] #farmCol{display:none}
  .grid[data-tab="fazenda"] #planCol{display:none}
}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Festival */
.fest-card{background:var(--berry-soft);border-color:transparent}
.fest-card h2{color:var(--berry)}

/* Missões dos jogadores */
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.missions{grid-template-columns:minmax(0,1fr)}}
.mission{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel2);min-width:0}
.mission .who{display:flex;align-items:center;gap:8px;font-weight:800}
.avatar{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:.9rem;color:var(--accent-ink);background:var(--accent);flex:none}
.avatar.p2{background:var(--berry)}
.mission .goal{font-family:var(--display);font-size:1.15rem;line-height:1.2}
.mission .why{font-size:.85rem;color:var(--muted)}

/* Listas de tarefas */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 6px;border-radius:8px}
.task:hover{background:var(--panel2)}
.task input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.task .t{font-weight:700}
.mission .task .t{font-weight:600}
.task .d{font-size:.88rem;color:var(--muted)}
.task.done .t,.task.done .d{text-decoration:line-through;opacity:.55}
.prio{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;white-space:nowrap;margin-left:6px;vertical-align:2px}
.prio.p1{background:var(--accent);color:var(--accent-ink)}
.prio.p2{background:var(--gold-soft);color:var(--gold)}
.prio.p3{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.group-label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-top:6px}

/* CC hoje */
.cc-list{display:flex;flex-direction:column;gap:8px}
.cc-item{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);min-width:0}
.cc-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between}
.cc-item .n{font-weight:800}
.cc-item .h{font-size:.86rem;color:var(--muted)}
.tag{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--sky-soft);color:var(--sky)}
.tag.last{background:var(--berry-soft);color:var(--berry)}
.tag.lock{background:var(--panel);color:var(--muted);border:1px solid var(--line)}

/* Tabela de plantio */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right}
.pill{display:inline-block;font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold);margin-left:6px}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:620px){.cal{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cal-d{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-height:84px;background:var(--panel2);min-width:0}
.cal-d.today{border-color:var(--season);box-shadow:inset 0 0 0 1px var(--season)}
.cal-d .dn{font-family:var(--display);font-size:1.05rem}
.cal-d .wd{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.cal-d .ev{font-size:.76rem;line-height:1.25;overflow-wrap:anywhere}
.cal-d .ev.f{color:var(--berry);font-weight:800}
.cal-d .ev.b{color:var(--gold);font-weight:700}

/* Claude */
.ai-out{white-space:normal;font-size:.95rem;background:var(--panel2);border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.ai-out h4{font-family:var(--display);font-size:1rem;margin:10px 0 4px}
.ai-out h4:first-child{margin-top:0}
.ai-out ul{margin:4px 0;padding-left:20px}
.ai-out p{margin:4px 0}

/* Formulário */
details.sec{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:1.02rem}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-family:var(--display);color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
details.sec>summary .sum{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:600;margin-left:auto}
.sec-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.code-show{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.05rem;font-weight:700;letter-spacing:.06em;background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;user-select:all;overflow-wrap:anywhere}
.sync-box{width:100%;min-height:84px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 9px;font:inherit;font-size:16px;color:inherit;resize:vertical}
.sync-msg{font-size:.88rem;display:flex;flex-direction:column;gap:8px}
.sync-msg:empty{display:none}
.sync-msg.ok{color:var(--ok)}
.sync-msg.err{color:var(--berry)}
.field input,.field select{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 9px;width:100%;min-width:0;font-size:16px}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.92rem}
.check input{width:17px;height:17px;margin-top:3px;accent-color:var(--accent);flex:none}
.pl{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pl:first-child{border-top:0;padding-top:0}
.room{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.room:first-child{border-top:0;padding-top:0}
.room-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.room-h b{font-family:var(--display);font-weight:500}
.bundle{display:flex;flex-direction:column;gap:6px}
.bundle.done{opacity:.6}
.bundle-h{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;font-weight:700}
.bundle-h .cnt{font-variant-numeric:tabular-nums;color:var(--muted)}
.bundle-h .cnt.ok{color:var(--ok)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.it{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600}
.it .it-en{font-size:.72rem;opacity:.65;font-weight:600}
.it[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.save{font-size:.8rem;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;font-weight:800}
.plants{display:flex;flex-direction:column}
.plant{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.plant:last-child{border-bottom:0}
.plant .pn{font-weight:800}
.plant .pp{font-weight:800;text-align:right;color:var(--ok)}
.plant .pd{grid-column:1 / -1;font-size:.84rem;color:var(--muted)}
.sched{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.84rem;color:var(--ink)}
.sched ul{margin:4px 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.sched li b{display:inline-block;min-width:3.2em;font-variant-numeric:tabular-nums}
.sched details{margin:4px 0}
.sched .muted{color:var(--muted)}
.qbox{grid-column:1 / -1;background:var(--gold-soft);border-radius:8px;padding:8px 11px;font-size:.84rem;margin-top:6px}
.qbox ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.qbox p{margin:6px 0 0}
.plant .pill{align-self:start;justify-self:end;white-space:nowrap;margin-left:0}
.loading{padding:24px;text-align:center}
@media (max-width:980px){
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom, 0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:0;border-width:1px 0 0;background:var(--panel);
    padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
  .tabs button{padding:11px}
  .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom, 0px))}
}
@media (max-width:620px){
  body{font-size:15px;padding-block:12px}
  .wrap{gap:12px}
  .card{padding:14px;gap:10px;border-radius:12px}
  .card-h{flex-direction:column;align-items:flex-start;gap:2px}
  .dateband{padding:14px;gap:10px}
  .dateband .actions{width:100%}
  .dateband .actions .btn{width:100%;padding:11px}
  .mission{padding:12px 0 4px;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0}
  .mission:first-child{border-top:0;padding-top:0}
  .missions{gap:8px}
  .task{padding:7px 0;gap:9px}
  .task input{width:20px;height:20px;margin-top:2px}
  .cc-item{padding:9px 11px}
  details.sec>summary{padding:14px}
  .sec-body{padding:0 14px 14px}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .it{padding:6px 11px;font-size:.84rem}
}
@media (prefers-reduced-motion:no-preference){.task,.it,.btn{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="dateband" id="dateband"></header>
  <div class="banner" id="exampleBanner" hidden><span><b>Exemplo.</b> Estes dados são só para mostrar como funciona. Abram <b>Nossa fazenda</b> e coloquem os dados de vocês.</span></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-plano" aria-selected="true" data-tab="plano">Plano do dia</button>
    <button role="tab" id="tab-fazenda" aria-selected="false" data-tab="fazenda">Nossa fazenda</button>
  </div>
  <div class="grid" id="grid" data-tab="plano">
    <main class="col" id="planCol"><div class="card loading"><b>Carregando…</b><span class="small muted">Se esta mensagem não sumir, o app que abriu o arquivo não roda páginas. Abram o arquivo no Chrome (Android) ou no Safari (iPhone).</span></div></main>
    <aside class="col" id="farmCol"></aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ DADOS DO JOGO (versão 1.6) ============ */
const SEASONS=['Primavera','Verão','Outono','Inverno'];
const WEEK=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const WEATHER={sol:'Ensolarado',chuva:'Chuva',tempestade:'Tempestade',verde:'Chuva verde',vento:'Ventando',neve:'Neve'};
const LUCK={'':'Não vimos','2':'Muito boa','1':'Boa','0':'Neutra','-1':'Ruim','-2':'Muito ruim'};
const LV=['Básico','Cobre','Aço','Ouro','Irídio'];
const TOOLS=[
 ['wcan','Regador',LV],['hoe','Enxada',LV],['pick','Picareta',LV],['axe','Machado',LV],
 ['rod','Vara de pesca',['Nenhuma','Vara de bambu','Fibra de vidro','Irídio']],
 ['pack','Mochila',['Inicial (12)','Grande (24)','De luxo (36)']]
];
const TOOL0={wcan:0,hoe:0,pick:0,axe:0,rod:1,pack:0};
// melhoria no Clint para o próximo nível: [ouro, barra]
const UPG=[[2000,'cobre'],[5000,'ferro'],[10000,'ouro'],[25000,'irídio']];
const TOOL_ART={wcan:'o regador',hoe:'a enxada',pick:'a picareta',axe:'o machado'};
const TOOL_WHY={wcan:'Regador melhor molha várias plantas de uma vez.',pick:'Picareta melhor quebra pedras com menos golpes e abre pedras grandes.',axe:'Machado melhor corta tocos e troncos grandes (madeira de lei).',hoe:'Enxada melhor prepara várias casas de terra de uma vez.'};
const WEATHER_S={sol:'Sol',chuva:'Chuva',tempestade:'Temporal',verde:'Verde',vento:'Vento',neve:'Neve'};
const LUCK_S={'':'Não vi','2':'Ótima','1':'Boa','0':'Normal','-1':'Ruim','-2':'Péssima'};

// O que só dá para fazer ou conseguir em cada evento (Stardew Valley Wiki)
function festTasks(f,c){
  const n=f[3], out=[], T=(id,prio,t,d,who,fx)=>({id:'fest-'+id,prio,t,d,who:who||'bal',fx:fx||null});
  const missKey=(bid,idx)=>{ const b=bundleById(bid); return b&&!bundleDone(b)&&!st.cc[itemKey(bid,idx)]?itemKey(bid,idx):null; };
  if(n==='Festival do Ovo'){
    out.push(T('straw',1,'Comprar sementes de morango na barraca do Pierre',`Só vendem aqui, 100g cada. Plantem quando voltarem: a primeira colheita sai em 8 dias e depois a cada 4, até o fim da primavera. Comprem antes de falar com o Lewis: depois da caça aos ovos a barraca fecha.`));
    out.push(T('hunt',2,'Participar da caça aos ovos','Falar com o Lewis começa a caça e encerra o festival. Vocês voltam para casa às 22h.','both'));
  }
  if(n==='Festival do Deserto' && st.unl.bus){
    out.push(T('calico',2,'Ganhar Ovos de Calico nas atrações do Festival do Deserto','Os ovos são a moeda do festival e somem quando ele acaba. A barraca dos Ovos de Calico vende sementes de morango (dias 15 e 17), Caixas Misteriosas e o livro Semanário do Lenhador (100 ovos, XP de Coleta). O festival abre às 10h.','both'));
  }
  if(n==='Dança das Flores'){
    const ks=[missKey('sf',1),missKey('sf',3)].filter(Boolean);
    if(ks.length) out.push(T('flowers',1,`Comprar ${ks.map(k=>k==='sf:1'?'Narciso':'Dente-de-leão').join(' e ')} na barraca do Pierre e entregar no Centro Comunitário`,'Ele vende 10 por 50g. É para o conjunto Recursos de Primavera.','bal',{cc:ks}));
    out.push(T('dance',2,'Convidar alguém para dançar','A pessoa precisa ter 4 corações com vocês. Vocês dois também podem dançar juntos. Dançar dá 1 coração com o par.','both'));
  }
  if(n==='Luau') out.push(T('soup',1,'Colocar um item bom na sopa','Só vale item cru e comestível: fruta, legume, peixe ou coleta. Quanto maior a qualidade e o preço, melhor a reação do Governador e mais amizade com a cidade toda. Fruta ou legume com estrela de ouro, ou um peixe caro, funcionam bem. Nunca coloquem lixo.'));
  if(n==='Competição de Truta') out.push(T('trout',2,'Pescar Truta arco-íris no rio perto do Rancho da Marnie','Cada truta tem 33% de chance de vir com uma Etiqueta Dourada. No estande, a primeira etiqueta vale um Kit de Barraca; as próximas dão, em sequência, prêmios como Aspersor de qualidade, Covo, Diamante e Omnigeodo. As etiquetas ficam guardadas para o ano seguinte.','both'));
  if(n==='Dança das Medusas-da-Lua') out.push(T('jelly',3,'Ir à praia entre 22h e 0h','Façam o dia normal antes. É só assistir: falar com o Lewis começa a cena e encerra a festa.','both'));
  if(n==='Feira do Vale do Orvalho'){
    out.push(T('grange',1,'Montar a exposição da fazenda com 9 itens','A exposição é uma só para a fazenda. Contam variedade e qualidade: tentem 1 item de cada tipo (fruta, legume, produto animal, artesanal, peixe, mineral, coleta e prato), de preferência com estrela. Falar com o Lewis faz o julgamento; o 1º lugar dá 1.000 fichas estrela. Peguem os itens de volta depois.'));
    out.push(T('tokens',2,'Juntar fichas estrela','O jogo de pesca (50g) é o que mais rende: até 800 fichas por partida.','both'));
    out.push(T('stardrop',1,'Comprar a Fruta-estrela por 2.000 fichas','Aumenta a energia máxima para sempre. Só dá para comprar uma vez.','both'));
  }
  if(n==='Véspera dos Espíritos') out.push(T('maze',2,'Fazer o labirinto da Véspera dos Espíritos (22h–23h50)',st.year%2?'Neste ano o baú do fim tem a Abóbora Dourada. A passagem secreta começa embaixo e à esquerda da placa "?".':'Neste ano o baú do fim tem um Ticket de Prêmio (vale na Máquina de Recompensa da Mansão do Prefeito).','both'));
  if(n==='Festival do Gelo') out.push(T('icefish',1,'Ganhar o concurso de pesca no gelo','Precisa pegar pelo menos 5 peixes. Fiquem bem perto do buraco e lancem curto. A primeira vitória dá dois apetrechos de pesca, um ímã e um boné; depois disso, um Ticket de Prêmio.','both'));
  if(n==='Festival da Lula') out.push(T('squid',1,`Pescar lulas na praia (meta de hoje: ${c.D===12?8:10})`,(c.D===12?'Prêmios de hoje por lulas pescadas: 1 → 20 iscas de luxo; 3 → Prato do Mar; 5 → Pérola e 3 cafés; 8 → o livro A Arte dos Covos (se ainda não ganharam).':'Prêmios de hoje por lulas pescadas: 2 → boia armadilha; 5 → Prato do Mar; 7 → baú do tesouro e 2 expressos triplos; 10 → o livro A Arte dos Covos (se ainda não ganharam).')+' A contagem zera de um dia para o outro.','both'));
  if(n==='Mercado Noturno'){
    out.push(T('sub',2,'Pescar no submarino do Mercado Noturno','1.000g, entrada das 17h às 23h. Lula da Meia-noite, Peixe Assustador e Peixe-bolha só saem lá; às vezes vem até uma Pérola.',pickFor('fishing')));
    out.push(T('mermaid',2,'Ganhar a Pérola no barco da sereia','Depois do show, toquem nas conchas na ordem 1-5-4-2-3 (da esquerda para a direita). O barco fecha às 0h30.'));
    out.push(T('coffee',3,'Pegar o café grátis com a Mercadora do Deserto','Um por noite.','both'));
  }
  if(n==='Festival da Estrela Invernal'){
    out.push(T('secret',1,'Entregar o presente secreto','A carta do Lewis do dia 18 diz para quem é. O presente vale 5× mais amizade.','both'));
    const offer=[['Ovo de pata','an',5],['Lágrima congelada','ge',2],['Quartzo de fogo','ge',3],['Cenoura subterrânea','ex',2],['Concha','cp',9],['Raiz de inverno','wf',0]].filter(([nm,b,i])=>missKey(b,i)).map(x=>x[0]);
    if(offer.length) out.push(T('pierre',2,'Olhar a barraca do Pierre','A barraca vende alguns itens sorteados por ano. Se aparecer, servem para o Centro Comunitário: '+offer.join(', ')+'.'));
  }
  return out;
}

function whereText(name,c){
  if(festOn(c.S,c.D).length) return 'Hoje tem festival: vocês encontram todo mundo lá.';
  const wd=c.wd; let day='';
  switch(name){
   case 'Maru': day=(wd===1||wd===3)?'Hoje (terça ou quinta) ela trabalha na clínica do Harvey, das 9h às 16h.':'Hoje ela costuma ficar em casa ou pela montanha.'; break;
   case 'Harvey': day=wd<5?'Durante o dia atende na clínica.':''; break;
   case 'Pierre': day=wd===2?'Hoje (quarta) a loja fecha e ele sai pela cidade.':'Fica no balcão da loja das 9h às 17h.'; break;
   case 'Gus': day='Fica no Saloon Fruta Estrelar do meio-dia à meia-noite.'; break;
   case 'Emily': day='À noite trabalha no Saloon Fruta Estrelar, a partir das 16h.'; break;
   case 'Clint': day='Fica no balcão do Ferreiro durante o dia.'; break;
   case 'Willy': day='Fica na peixaria ou pescando no píer.'; break;
   case 'Robin': day='Fica no balcão da carpintaria das 9h às 17h.'; break;
   case 'Marnie': day=(wd===0||wd===1)?'Hoje (segunda ou terça) ela sai do rancho.':'Fica no balcão do rancho das 9h às 16h.'; break;
   case 'Shane': day=wd<5?'De dia trabalha no Mercado Joja; à noite vai ao Saloon Fruta Estrelar.':'À noite costuma ir ao Saloon Fruta Estrelar.'; break;
   case 'Pam': day='Costuma passar a noite no Saloon Fruta Estrelar.'; break;
   case 'Penny': day=(wd===1||wd===2||wd===4)?'Hoje de manhã ela dá aula para a Jas e o Vincent no museu.':''; break;
   case 'Sandy': case 'Feiticeiro': case 'Krobus': case 'Linus': case 'Anão': day='Quase sempre está lá.'; break;
  }
  if(wd===4 && ['Abigail','Sebastian','Sam','Leah','Elliott'].includes(name)) day+=' Sexta à noite (19h–23h) costuma ir ao Saloon Fruta Estrelar.';
  if(c.rain) day+=' Com chuva, a maioria fica em casa.';
  return `Onde achar: mora ${HOME[name]||'na cidade'}. ${day}`.trim();
}

    return {n,en,g,rg,seed,sell,harvests,profit,note,multi:x==='multi'&&c.S===1,shop:shopFor(c,x),bundle,q:bundle&&bundle.qb?qualityPlan(rg?harvests:1):null};
  }).filter(Boolean);
  const cc=list.filter(p=>p.bundle).sort((a,b)=>(a.bundle.quality-b.bundle.quality)||((a.bundle.quality&&a.q?a.q.best.seeds:0)-(b.bundle.quality&&b.q?b.q.best.seeds:0))||(a.bundle.left-b.bundle.left)||(a.g-b.g));
  const money=list.filter(p=>!p.bundle).sort((a,b)=>b.profit-a.profit).slice(0,4);
  return {cc,money};
}
function missingNames(kinds,max){
  const out=[];
  ROOMS.forEach(r=>r.bundles.forEach(b=>{ if(bundleDone(b)) return;
    b.items.forEach((it,i)=>{ if(!st.cc[itemKey(b.id,i)]&&kinds.includes(it.k)&&!out.includes(it.n)) out.push(it.n); }); }));
  return out.slice(0,max);
}
function bundleById(id){for(const r of ROOMS) for(const b of r.bundles) if(b.id===id) return b; return null}

function buildPlan(){
  const c=ctxOf(st), P=st.players, tasks=[];

  if(c.newbie && c.D<=3 && st.farm.crops==='nenhuma') tasks.push(T('plant15',1,'Plantar as 15 sementes de chirívia','Limpem um pedaço perto da casa com a enxada, plantem e reguem. Ficam prontas em 4 dias.',farmerIdx,{set:[['farm.crops','poucas']]}));
  // No dia 28 só vale regar o que continua na estação seguinte (wiki: café primavera→verão; milho, girassol e trigo verão→outono)
  const carry={0:['Grão de café'],1:['Milho','Girassol','Trigo'],2:[]}[c.S]||[];
  const lastDay=c.D===28;
  const carryTxt=carry.length>1?carry.slice(0,-1).join(', ')+' e '+carry[carry.length-1]:(carry[0]||''), carryVerb=carry.length>1?'continuam':'continua';
  const needWater=!st.farm.sprinklers; // com aspersores em toda a plantação, não precisa regar
  if(needWater && hasCrops && outdoors && !c.rain && lastDay && carry.length) tasks.push(T('water',1,`Regar só ${carryTxt}`,
      `Amanhã as plantas desta estação morrem. Só ${carryTxt} ${carryVerb} no ${SEASONS[c.S+1]}: reguem só ${carry.length>1?'essas':'essa'}. Se não tiverem, pulem esta tarefa.`,farmerIdx));
  if(needWater && hasCrops && outdoors && !c.rain && !lastDay) tasks.push(T('water',1,'Regar as plantações',
      waterBoth?'Dividam o campo ao meio: cada um rega uma parte.':st.farm.sprinklers?'Reguem o que os aspersores não alcançam.':'Façam logo de manhã. Encham o regador na água mais próxima.',waterBoth?'both':farmerIdx));
  if(hasCrops && outdoors && c.D===28) tasks.push(T('last',1,'Colher tudo antes de dormir',`Amanhã as plantações desta estação morrem.${carry.length?` Só ${carryTxt} ${carryVerb} no ${SEASONS[c.S+1]}.`:' Nenhuma planta passa para o inverno.'}`,farmerIdx));
  else if(hasCrops && outdoors) tasks.push(T('harvest',1,'Colher o que estiver pronto e vender na caixa de envio','Guardem 1 de cada item que ainda falta nos conjuntos do Centro Comunitário.',farmerIdx));
  if(st.farm.greenhouse && c.S===3) tasks.push(T('gh',1,st.farm.sprinklers?'Colher a estufa':'Regar e colher a estufa','No inverno só a estufa produz.',farmerIdx));
  if(st.farm.coop||st.farm.barn) tasks.push(T('animals',1,'Fazer carinho nos animais e coletar os produtos',st.farm.silo?'O feno sai sozinho do silo para o comedouro.':'Coloquem feno no comedouro. Sem silo, comprem feno na Marnie.',1-farmerIdx));
  const vault=['v1','v2','v3','v4'].map(bundleById).find(b=>!bundleDone(b));

  if(outdoors){ let k=0;
    plants.cc.forEach(pl=>{
      if(k>=2) return;

      tasks.push(T('plant-'+key,1,`Plantar ${n} ${pl.n} para o Centro Comunitário`,

        `Sementes de ${pl.seed}g ${pl.shop}.${st.farm.sprinklers?' Plantem dentro do alcance dos aspersores.':''} Ficam prontas em ${pl.g} dias: em ${SEASONS[ready.season]} ${ready.day} a colheita aparece aqui.`,who,{plant:rec,money:-cost}));
    });

  if(c.S===3 && !bundleDone(bundleById('wf'))) tasks.push(T('dig',2,'Cavar a terra com a enxada','Na fazenda e na floresta aparecem Raiz de Inverno e Inhame de neve, do conjunto Recursos de Inverno.'));
  { const fl=Math.max(P[0].farming,P[1].farming), fi=pickFor('farming');
    if(!st.farm.sprinklers && st.farm.crops!=='nenhuma' && ((fl>=9&&st.unl.skull)||(fl>=6&&st.mine>=80))) tasks.push(T('sprink',2,fl>=9&&st.unl.skull?'Fazer aspersores de irídio':'Fazer aspersores de qualidade',
      fl>=9&&st.unl.skull?'Receita de Cultivo 9: 1 barra de ouro + 1 de irídio + 1 conjunto de pilhas. Rega 24 quadrados em volta.':'Receita de Cultivo 6: 1 barra de ferro + 1 de ouro + 1 quartzo refinado. Rega os 8 quadrados em volta.',fi,{set:[['farm.sprinklers',true]]})); }
  if(!st.farm.furnace && c.minesOpen) tasks.push(T('furnace',2,'Levar minério de cobre para o Clint','Ele ensina a fazer a fornalha, que transforma minério em barras.','act:mines',{set:[['farm.furnace',true]]}));
  if(c.wd!==2) [0,1].filter(i=>tl(i,'pack')===0).forEach(i=>{ if(spend(2000)) tasks.push(T('pack-'+i,2,'Comprar a mochila grande no Pierre','2.000g. São 12 espaços a mais, menos viagens para casa.',i,{set:[[`players.${i}.tools.pack`,1]],money:-2000})); });
  // Covos: recolher todo dia e mudar de lugar quando o conjunto precisar
  if(st.farm.crabWhere && !bundleDone(bundleById('cp')) && !(c.beachClosed && st.farm.crabWhere==='mar')){
    const cp=bundleById('cp'), SEA=[0,2,3,4,5,8,9], FRESH=[1,6,7];
    const miss=ix=>ix.filter(k=>!st.cc['cp:'+k]).map(k=>cp.items[k].n);
    const sea=miss(SEA), fresh=miss(FRESH), done=bundleDone(cp), where=st.farm.crabWhere;
    const fi=pickFor('fishing');
    const here=where==='mar'?sea:fresh;
    tasks.push(T('crabcheck',1,`Recolher os covos ${where==='mar'?'na praia':'no rio ou lago'} e colocar isca de novo`,
      (done?'O conjunto Covo já está completo: o que sair pode vender. ':here.length?`Para o conjunto Covo ainda faltam: ${here.join(', ')}. O que vier, entreguem no Centro Comunitário. `:'')+'Isca: o Willy vende por 5g cada. Um covo sem isca não pega nada.',fi));
    if(!done && where==='mar' && !sea.length && fresh.length) tasks.push(T('crabmove',2,'Mudar os covos para o rio ou o lago',`No mar já saiu tudo que o conjunto precisa. ${fresh.join(', ')} só saem em água doce: rio da cidade, rio da Floresta Cinzaseiva ou lago da montanha.`,fi,{set:[['farm.crabWhere','doce']]}));
    if(!done && where==='doce' && !fresh.length && sea.length) tasks.push(T('crabmove',2,'Mudar os covos para a praia',`Na água doce já saiu tudo que o conjunto precisa. ${sea.join(', ')} só saem no mar.`,fi,{set:[['farm.crabWhere','mar']]}));
  }
  // Ferramentas que estão com o Clint
  st.upgrading=(st.upgrading||[]).filter(u=>u&&u.readyAbs);
  st.upgrading.forEach(u=>{ if(now>=u.readyAbs) tasks.push(T(`pickup-${u.id}`,1,`Buscar ${TOOL_ART[u.tool]} no Clint`,`Já está pronta: agora é de ${LV[u.lv].toLowerCase()}. O Clint atende das 9h às 16h.`,u.i,{set:[[`players.${u.i}.tools.${u.tool}`,u.lv]],unupg:u.id})); });
  // Chuva verde (só no verão): mato gigante e árvores de chuva verde por todo o vale
  if(c.green){
    tasks.push(T('green',2,'Aproveitar a chuva verde: cortar o mato gigante e pegar Sementes Musgosas',
      `Hoje aparece mato gigante e árvores de chuva verde no vale todo (menos na praia e no deserto). Cada mato gigante dá 15 XP de Coleta e some amanhã. As Árvores de Chuva Verde dão Semente Musgosa, e as árvores normais podem ficar cobertas de Musgo.${c.Y===1?' No ano 1, quase todo mundo fica em casa e não dá para dar presentes hoje.':''} A chuva rega as plantações.`,pickFor('foraging')));
  }
  // Caverna da fazenda
  { const cave=st.farm.cave;
    if(cave && CAVE[cave] && now%CAVE[cave].every===0){
      const need=caveNeeds(cave);
      tasks.push(T('cave',2,cave==='morcegos'?'Pegar as frutas da caverna da fazenda':'Pegar os cogumelos da caverna da fazenda',
        `${CAVE[cave].how} ${need.length?`Se aparecer, entreguem no Centro Comunitário: ${need.join(', ')}.`:'Guardem algumas para presentes e para máquinas.'}`,pickFor('foraging')));
    }
    if(!cave && (st.year>1||st.season>=1)){
      const nb=caveNeeds('morcegos').length, nm=caveNeeds('cogumelos').length;
      const best=nb>=nm?'morcegos':'cogumelos';
      tasks.push(T('cavechoice',3,'Quando o Demetrius aparecer, escolher o que vai na caverna',
        `Ele aparece numa manhã depois que vocês ganham 25.000g no total, e a escolha é para sempre. Para o Centro Comunitário, hoje os ${best} ajudam mais: ${best==='morcegos'?`frutas para ${nb} itens que faltam (Artesão, Encantador, Forragem e Recursos)`:`cogumelos para ${nm} itens que faltam (Recursos Exóticos, Tinta, Pesquisa de campo e Recursos de Outono)`}. Depois marquem a escolha em Nossa fazenda → Fazenda.`));
    }
  }
  // Poderes: livreiro, livro grátis e Magia da Floresta
  if(st.unl.cc && !st.special.forest) tasks.push(T('forest',1,'Visitar o Feiticeiro na Torre do Mago','Depois de ler o pergaminho do Centro Comunitário, ele ensina a entender os Junimos (Magia da Floresta). A torre fica no oeste da Floresta Cinzaseiva.','bal',{set:[['special.forest',true]]}));
  { const marked=(st.bookDays.match(/\d+/g)||[]).map(Number);
    const bookToday=marked.includes(c.D);

    if(bookToday){
      const list=BOOKS.filter(b=>b.shop&&(!b.y3||st.year>=3)&&(!b.need||b.need())).sort((a,b)=>a.pri-b.pri);

      }));
      if(!any) tasks.push(T('bookvisit',3,'Passar no livreiro (acima do Mercado Joja)','Hoje ele está na cidade. Vocês já têm os livros de poder que ele vende sempre; vale olhar os livros de habilidade.'));

  }
  // O caminho até a lixeira dourada tem um tronco grande e uma pedra grande: precisa de machado e picareta de aço (wiki)
  if(maxTool('axe')>=2 && maxTool('pick')>=2) [0,1].forEach(i=>{ if(!hasPw(i,'alley')) tasks.push(T('alley-'+i,3,'Pegar o livro O Bufê do Beco na lixeira dourada','De graça: há uma abertura escondida na cerca leste da cidade, logo ao norte dos trilhos do carrinho de mina perto do Ferreiro. No caminho tem um tronco grande e uma pedra grande: quem tiver machado e picareta de aço abre a passagem. A lixeira fica atrás de uma árvore no fim do caminho. Dá mais chance de achar coisas no lixo.',i,{set:[[`players.${i}.pw.alley`,true]]})); });
  // Construções e máquinas que vocês querem e ainda não têm
  { let n=0, robinUsed=false;

    list.sort((a,b)=>(b.cc?1:0)-(a.cc?1:0));

      if(b.robin){ if(robinUsed || (st.robinUntil||0)>now || !spend(b.g)) continue; robinUsed=true; }

      tasks.push(T('build-'+b.id,b.cc?2:3,b.up?`Melhorar para ${b.n.toLowerCase()} na Robin`:b.robin?`Encomendar ${b.n.toLowerCase()} na Robin`:`Fazer ${b.n.toLowerCase()}`,
        `${b.robin?`Custa ${b.g.toLocaleString('pt-BR')}g, `:'Materiais: '}${b.mat}. ${b.why}${b.sk?` Receita de ${SKILL_PT[b.sk[0]]} ${b.sk[1]}.`:` A Robin leva ${b.days||2} dias e faz uma obra por vez.`}`,who,
        {set:[...(b.set||[['owned.'+b.id,'have']]),...(b.robin?[['robinUntil',now+(b.days||2)]]:[])],money:b.robin?-b.g:0}));
    }
  }
  if(c.wd!==2 && tl(0,'pack')>=1 && tl(1,'pack')>=1){ const n2=[0,1].filter(i=>tl(i,'pack')===1); if(n2.length && spend(10000)) tasks.push(T('pack2',3,'Comprar a mochila de luxo no Pierre','10.000g, mais 12 espaços.',n2[0],{set:[[`players.${n2[0]}.tools.pack`,2]],money:-10000})); }
  if(c.wd===4||c.wd===6){
    const want=missingNames(['long','crop'],3);
    tasks.push(T('cart',3,'Passar no Carrinho de Viagem (floresta, 6h–20h)',want.length?`Procurem itens que faltam nos conjuntos, como ${want.join(', ')}.`:'Às vezes ela vende sementes e itens raros.','act:forage'));
  }

  if(c.rodOk){

  {

  { const ccCount={mines:mineToday.length,fish:fishToday.length,forage:forageToday.length};

  { const m2=assign.findIndex(a=>a&&a.id==='mines2');

  }
  const keepFull=/^(water|harvest|last|animals|gh|crabcheck|cave$|harv-|fest-)/;
  if(fullDay){ for(let k=tasks.length-1;k>=0;k--) if(!keepFull.test(tasks[k].id)) tasks.splice(k,1); }
  fests.forEach(f=>festTasks(f,c).forEach(t=>tasks.push(t)));

  if(bday && !(c.green&&c.Y===1) && !used.has('social')) tasks.push(T('bday',1,`Dar um presente de aniversário para ${bday}`,esc(giftText(bday))+schedHTML(bday,c)));
  if(!used.has('farm') && outdoors && st.farm.crops!=='muitas'){
    const top=plants.money[0];
    if(top && c.daysLeft>=top.g) tasks.push(T('seeds',3,`Plantar ${top.n} para vender`,`Semente de ${top.seed}g ${top.shop}. Lucro de uns ${top.profit}g por semente até o fim da estação.`,farmerIdx));
  }

  // Melhorar ferramentas: uma por jogador, só quando a barra já está ao alcance e a ferramenta não faz falta hoje
  { let bud=c.budget??st.money;
    const barOk=lv=>[st.farm.furnace,st.mine>=40,st.mine>=80,st.unl.skull][lv];
    [0,1].forEach(i=>{
      if((st.upgrading||[]).some(u=>u.i===i)) return;
      const mid=missions[i]&&missions[i].id;
      const order=[
        ['wcan',(c.tomorrowRain&&!c.rain)||c.S===3||!hasCrops||(i!==farmerIdx&&!waterBoth)],
        ['pick',mid!=='mines'&&mid!=='skull'],
        ['axe',mid!=='forage'],
        ['hoe',c.S===3]
      ];
      for(const [k,okToday] of order){
        const lv=tl(i,k); if(lv>=4||!okToday||!barOk(lv)) continue;
        const cost=UPG[lv][0]; if(cost>bud) continue;
        bud-=cost;
        const id=`${i}-${k}-${lv+1}`;
        tasks.push(T('upg-'+id,2,`Deixar ${TOOL_ART[k]} no Clint para virar de ${LV[lv+1].toLowerCase()}`,
          `Custa ${upgText(lv)}. O Clint fica com ela 2 dias e a página avisa quando for buscar. ${TOOL_WHY[k]}`,i,{upg:{id,i,tool:k,lv:lv+1,readyAbs:now+2},money:-cost}));
        break;
      }
    });
    c.budget=bud;
  }
  if(fullDay){ for(let k=tasks.length-1;k>=0;k--) if(!keepFull.test(tasks[k].id)) tasks.splice(k,1); }
  // Dividir as tarefas: primeiro as que têm dono, depois equilibrando as listas
  const perPlayer=[[],[]];
  const owner=w=>{ if(typeof w==='string'&&w.startsWith('act:')){const o=assign.findIndex(a=>a&&a.id===w.slice(4)); return o>=0?o:'bal';} return w; };
  const later=[];
  tasks.forEach(t=>{ const w=owner(t.who);
    if(w==='both'){ perPlayer[0].push({...t,id:t.id+'-0'}); perPlayer[1].push({...t,id:t.id+'-1'}); }
    else if(w===0||w===1) perPlayer[w].push(t); else later.push(t); });
  later.forEach(t=>perPlayer[perPlayer[0].length<=perPlayer[1].length?0:1].push(t));
  // Junta tudo numa lista só por jogador: tarefas da fazenda, recados, atividade principal e, no fim, o que é opcional
  perPlayer.forEach((l,i)=>{
    const m=missions[i];
    const mt=m?m.tasks.map((t,j)=>{ const o=typeof t==='string'?{t}:t; const extra=j===0?[m.why,m.tip].filter(Boolean).join(' '):''; return {id:o.id?`m${i}-${o.id}`:`m${i}-${m.id}-${j}`,prio:2,t:esc(o.t),d:esc([o.d,extra].filter(Boolean).join(' '))+(o.dh||''),ord:2,fx:o.fx||null}; }):[];
    l.forEach(t=>t.ord=t.prio===1?0:t.prio===2?1:3);
    l.push(...mt);
  });
  // Tarefas já marcadas hoje continuam na lista, mesmo que o plano tenha mudado por causa delas
  // Depois da primeira tarefa marcada, o plano do dia fica fixo (não aparecem tarefas novas no lugar)
  if(st.frozen && st.frozen.abs===absDay(st)){ perPlayer[0]=clone(st.frozen.lists[0]||[]); perPlayer[1]=clone(st.frozen.lists[1]||[]); }
  const ids=new Set(perPlayer.flat().map(t=>t.id));
  Object.entries(st.done||{}).forEach(([id,v])=>{ if(v&&v.snap&&!ids.has(id)) perPlayer[v.snap.who===1?1:0].push({...v.snap,id}); });
  perPlayer.forEach(l=>l.sort((a,b)=>(startOf(a)-startOf(b))||(a.ord-b.ord)));

  return {c,fests,bday,tasks,perPlayer,missions,cc,plants};
}

function mineMission(p,c,cc,opts={}){
  const lvl=st.mine||0, deep=lvl>=120;
  const target=deep?120:Math.min(120,Math.floor((lvl+10)/5)*5);
  const lo=deep?80:lvl, hi=target;
  const ore=lo<40?'cobre':lo<80?'ferro':'ouro';
  const luck=c.luck===null?'Vejam a sorte na TV: com sorte boa sai mais minério e mais escadas.':c.luck>=1?'A sorte está boa hoje: sai mais minério e mais escadas.':c.luck<=-1?'A sorte está ruim, então não precisam ir tão fundo hoje.':'Sorte neutra: um dia normal de mina.';
  const descDone=Object.keys(st.done||{}).some(k=>/-desc-/.test(k));
  const tasks=(descDone||opts.second)?[]:[{id:'desc-'+lvl,fx:deep?null:{set:[['mine',target]]},t:deep?'Descer pelo elevador até o andar 80 ou mais':`Descer do andar ${lvl} até o ${target}`,
    d:`Nesses andares sai minério de ${ore} e carvão: juntem tudo pelo caminho. ${luck} O elevador salva a cada 5 andares.`}];
  if(descDone && !opts.second) tasks.push({id:'more-'+lvl,t:`Continuar minerando perto do andar ${lvl}`,d:`Vocês já desceram o combinado hoje. Se ainda tiver tempo, sai minério de ${ore} e carvão por aqui.`});
  const items=cc.filter(x=>x.it.k==='mine'&&x.ok&&x.it.fl&&!(opts.exclude&&(x.keys||[x.key]).some(k=>opts.exclude.has(k))));
  const here=[], back=[];
  items.forEach(x=>{ const [a,b]=x.it.fl; if(x.it.bar){ if(st.farm.furnace && a<=Math.max(lvl,1)) here.push(x); } else if(b>=lo&&a<=hi) here.push(x); else if(b<lo) back.push(x); });
  const w=x=>(x.it.bar?200:0)+(x.it.en==='Stone'?300:0)+(x.it.fl[1]-x.it.fl[0]);
  here.sort((a,b)=>w(a)-w(b)); back.sort((a,b)=>w(a)-w(b));
  [...here,...back].slice(0,3).forEach(x=>{
    const it=x.it, [a,b]=it.fl;
    const fx={cc:x.keys||[x.key]}, id='cc-'+x.key, mn=multiNote(x);
    if(it.en==='Stone') tasks.push({id,fx,t:'Juntar 99 pedras e entregar no Centro Comunitário',d:'Qualquer pedra das minas serve.'});
    else if(it.bar) tasks.push({id,fx,t:`Fazer ${x.need>1?x.need:1} ${it.n.toLowerCase()} na fornalha e entregar no Centro Comunitário`,d:`${it.h}.${mn}`});
    else if(b>=lo&&a<=hi&&!opts.second) tasks.push({id,fx,t:`Pegar ${it.n} e entregar no Centro Comunitário`,d:`${it.h}. Sai nos andares onde vocês vão passar hoje.${mn}`});
    else { const el=Math.floor(Math.min(Math.max(a,1),Math.max(lvl,1))/5)*5; tasks.push({id,fx,t:`Pegar ${it.n} e entregar no Centro Comunitário`,d:`${it.h}. ${opts.second?'Vão':'Não sai nos andares de hoje: voltem'} pelo elevador ${el?`ao andar ${el}`:'para a entrada das minas'}.${mn}`}); }
  });
  const ghost=cc.find(x=>x.it.en==='Ghostfish'&&x.ok);
  if(ghost && c.rodOk && !(opts.exclude&&(ghost.keys||[ghost.key]).some(k=>opts.exclude.has(k))) && !opts.second) tasks.push({id:'cc-'+ghost.key,fx:{cc:ghost.keys||[ghost.key]},t:'Pescar o Peixe-fantasma e entregar no Centro Comunitário',d:`Nos lagos dos andares 20 e 60 (o elevador para no 20 e no 60).`});
  if(opts.second){
    // segunda pessoa: busca os itens que sobraram pelo elevador; se não sobrou nenhum, desce junto
    const join={id:'join-'+lvl,t:`Descer junto com ${opts.partner} ${deep?'pelo elevador até o andar 80 ou mais':`até o andar ${target}`}`,d:`Nesses andares sai minério de ${ore} e carvão: juntem tudo pelo caminho. Em dupla dá para descer mais rápido.`};
    if(!tasks.length || !descDone) tasks.unshift(join);
    return {goal:`Minas com ${opts.partner}`,why:'',tasks};
  }
  return {goal:deep?'Minas: andares 80 a 120':`Minas: do andar ${lvl} ao ${target}`,why:'',tasks};
}
function fishMission(p,c,items,i){
  const tasks=[];
  items.slice(0,3).forEach(x=>tasks.push({id:'cc-'+x.key,fx:{cc:x.keys||[x.key]},t:`Pescar ${x.it.n} e entregar no Centro Comunitário`,d:dot(x.it.h)+multiNote(x)}));
  if(!items.length) tasks.push({t:'Pescar e vender os peixes',d:c.beachClosed?`Hoje a praia só abre às 22h por causa do festival: pesquem no ${RIO.charAt(0).toLowerCase()+RIO.slice(1)} ou no lago da montanha.`:`De manhã: ${MAR}. À tarde: ${RIO}.`});
  const other=1-i;
  if(!c.beachClosed && p.fishing>=6 && tl(i,'rod')===2 && (c.budget??st.money)>=7500){ c.budget=(c.budget??st.money)-7500; tasks.unshift({id:'rod3',fx:{set:[[`players.${i}.tools.rod`,3]],money:-7500},t:'Comprar a vara de irídio no Willy (7.500g)'}); }
  if(p.fishing>=2 && tl(i,'rod')<2){
    if(tl(other,'rod')>=2) tasks.unshift(`Pegar a vara de ${tl(other,'rod')===3?'irídio':'fibra de vidro'} de ${st.players[other].name} emprestada`);
    else if(!c.beachClosed && (c.budget??st.money)>=1800){ c.budget=(c.budget??st.money)-1800; tasks.unshift({id:'rod2',fx:{set:[[`players.${i}.tools.rod`,2]],money:-1800},t:'Comprar a vara de fibra de vidro e isca no Willy (1.800g)'}); }
  }
  if(p.fishing>=3 && !c.beachClosed && !st.farm.crabWhere && st.mine>=40 && !bundleDone(bundleById('cp'))) tasks.push({id:'crab',fx:{set:[['farm.crabWhere','mar'],['farm.crab',true]]},t:'Fazer 2 covos e colocar no mar',d:'Cada covo: 40 madeira + 3 barras de ferro (receita de Pesca 3). Coloquem isca dentro todo dia.'});
  const why=c.rain?'Dia de chuva é o melhor para pescar: aparecem peixes raros.':items.length?'Tem peixe dos conjuntos disponível hoje.':'Peixe dá dinheiro rápido e treina a habilidade.';
  let tip=p.fishing<2?'Segurem o botão para lançar mais longe. Na barra verde, toques curtos seguram o peixe.':'Guardem 1 de cada peixe dos conjuntos antes de vender.';
  if(p.fishing>=2 && tl(i,'rod')<2 && tl(other,'rod')>=2) tip='Para emprestar, quem tem a vara coloca ela num baú ou joga no chão perto do outro.';
  return {goal:items.length?`Pescar ${items[0].it.n}`:'Dia de pesca',why,tasks,tip};
}
function forageMission(p,c,items,berry,i){
  const tasks=[];
  if(berry) tasks.push(c.S===0?'Colher amoras-silvestres nos arbustos (época dos dias 15 a 18)':'Colher amoras nos arbustos (época dos dias 8 a 11)');
  items.filter(x=>!/Madeira/.test(x.it.n)).slice(0,3).forEach(x=>tasks.push({id:'cc-'+x.key,fx:{cc:x.keys||[x.key]},t:`Coletar ${x.it.n} e entregar no Centro Comunitário`,d:dot(x.it.h)+multiNote(x)}));
  const con=bundleById('con');
  if(!bundleDone(con)){
    const wk=['con:0','con:1'].find(k=>!st.cc[k]);
    if(!st.cc['con:3'] && tl(i,'axe')>=1) tasks.push({id:'cc-con:3',fx:{cc:['con:3']},t:'Juntar 10 de madeira de lei e entregar no Centro Comunitário',d:'Cortem os tocos grandes com o machado de cobre (fazenda e Floresta Cinzaseiva).'});
    else if(wk) tasks.push({id:'cc-'+wk,fx:{cc:[wk]},t:'Juntar 99 de madeira e entregar no Centro Comunitário',d:'Cortem árvores na fazenda ou na floresta.'});
  }
  return {goal:berry?'Colher frutinhas e coletas':'Coletar pela cidade',why:items.length?'Faltam itens de coleta nos conjuntos desta estação.':'Coletas viram comida e dinheiro grátis.',tasks,tip:'Guardem 1 de cada coleta para os conjuntos e comam o resto quando a energia acabar.'};
}
function farmMission(p,c,plants){
  const tasks=[];
  const top=plants.cc[0], cash=plants.money[0];
  if(cash) tasks.push({t:`Plantar ${cash.n} para vender`,d:`Sementes ${cash.shop}. Lucro de uns ${cash.profit}g por semente até o fim da estação.`});
  tasks.push('Limpar mais um pedaço da fazenda com machado, picareta e foice');
  if(p.farming>=1 && st.farm.crops!=='nenhuma') tasks.push('Fazer um espantalho (50 madeira, 1 carvão, 20 fibra)');
  const tip=st.farm.sprinklers?'Plantem dentro do alcance dos aspersores, assim não precisam regar.':'Plantem em blocos perto da água para regar mais rápido.';
  return {goal:'Expandir a plantação',why:`Faltam ${c.daysLeft} dias na estação: ainda dá tempo de colher.`,tasks,tip};
}
function socialMission(p,c,bday){

  const r=(st.planted||[]).find(r=>r.key===p.bundle.key); if(!r) return '';
  const now=absDay(st), left=r.readyAbs-now;
  return `<b>Já plantado: ${left>0?`fica pronto em ${left} ${left>1?'dias':'dia'}`:'pronto para colher'}.</b> `;
}

function qualityHTML(p){
  const q=p.q, who=esc(st.players[q.fi].name), hard=q.best.seeds>60;
  return `<div class="qbox"><b>★ ${p.bundle.quality?'Precisa de 5 com estrela de ouro':'Além disso, o conjunto Plantações de Qualidade pede 5 com estrela de ouro'}</b>

function setByPath(path,val){
  const ks=path.split('.'); let o=st;
  for(let i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}
function onFormInput(e){
  const el=e.target;
  if(el.dataset.k){
    let v;
    if(el.type==='checkbox') v=el.checked;
    else if(el.type==='number'){ v=parseInt(el.value,10); if(isNaN(v)) return; v=Math.max(+el.min||0,Math.min(+el.max||1e9,v)); }
    else if(el.tagName==='SELECT' && (['season','players','gear'].some(p=>el.dataset.k.startsWith(p))||/Lv$/.test(el.dataset.k))) v=parseInt(el.value,10);
    else v=el.value;
    setByPath(el.dataset.k,v);
    commit({form:el.type==='text'||el.type==='number'?false:true});
  }
}
function render(opts={}){
  renderPlan();
  if(opts.form!==false) renderForm();
}

let undoState=null, toastTimer=null, pendingImport=null;
function exportCode(){
  const json=JSON.stringify({v:1,at:Date.now(),state:st});
  return 'SDV1:'+btoa(unescape(encodeURIComponent(json)));
}
function importCode(text){
  const m=String(text||'').replace(/\s+/g,'').match(/SDV1:([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!data||!data.state||!Array.isArray(data.state.players)||data.state.season==null||data.state.day==null) return null;
    return data;
  }catch(e){ return null; }
}
function syncMsg(html,cls){ const el=$('#syncMsg'); if(!el) return; el.className='sync-msg '+(cls||''); el.innerHTML=html; }
function describe(s){ return `Ano ${s.year}, ${SEASONS[s.season]} ${s.day}, de ${esc((s.players[0]||{}).name)} e ${esc((s.players[1]||{}).name)}`; }
function copyData(){
  const code=exportCode(), box=$('#pasteBox');
  const fallback=()=>{ if(box){ box.value=code; box.focus(); box.select(); }
    syncMsg('Não deu para copiar sozinho. O texto está na caixa abaixo e já está selecionado: copiem e mandem para o outro aparelho.','err'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>syncMsg(`Copiado (${describe(st)}). Agora colem no outro aparelho.`,'ok'),fallback);
  } else fallback();
}
function shareData(){
  const code=exportCode();
  navigator.share({title:'Stardew Hoje',text:code}).then(()=>syncMsg('Enviado. No outro aparelho, colem o texto e toquem em Carregar.','ok')).catch(e=>{ if(e&&e.name!=='AbortError') copyData(); });
}
function loadData(){
  const box=$('#pasteBox'); const data=importCode(box&&box.value);
  if(box) box.blur();
  if(!data){ syncMsg('Esse texto não é um código válido. Copiem de novo no outro aparelho e colem inteiro: ele começa com <b>SDV1:</b>.','err'); return; }
  undoState=clone(st);
  st=normalize(data.state); st.example=false;
  commit();
  selectTab('plano');
  showToast(`Carregado: ${SEASONS[st.season]} ${st.day}, ano ${st.year}.`,'Desfazer',()=>{st=undoState;commit()});
}
function showToast(msg,btnLabel,fn){
  const t=$('#toast'); t.innerHTML=`<span>${esc(msg)}</span>${btnLabel?`<button type="button" id="toastBtn">${esc(btnLabel)}</button>`:''}`; t.hidden=false;
  if(btnLabel) $('#toastBtn').onclick=()=>{t.hidden=true;fn()};
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,7000);
}
function nextDay(){
  undoState=clone(st);
  const d=addDays(st.season,st.day,st.year,1);
  if(d.season!==st.season) st.bookDays='';
  st.season=d.season; st.day=d.day; st.year=d.year;
  st.weather=st.forecast||(d.season===3?'neve':'sol');
  if(d.season===3&&st.weather==='chuva') st.weather='neve';
  st.forecast=''; st.luck=''; st.done={}; st.frozen=null;
  aiText='';
  if(d.day===1) showToast(`Bem-vindos ao ${SEASONS[d.season]}! Confiram o clima e a sorte na TV.`,'Desfazer',()=>{st=undoState;commit()});
  else showToast(`${SEASONS[d.season]} ${d.day}. Confiram o clima e a sorte na TV.`,'Desfazer',()=>{st=undoState;commit()});
  commit();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Claude ---------- */
let sampleApi=null, aiText='', aiCtl=null;
function md(t){
  const lines=esc(t).split('\n'); let out='', inUl=false;
  for(const raw of lines){
    const l=raw.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^#{1,4}\s/.test(l)){ if(inUl){out+='</ul>';inUl=false} out+=`<h4>${l.replace(/^#{1,4}\s/,'')}</h4>`; }
    else if(/^\s*[-*•]\s/.test(l)){ if(!inUl){out+='<ul>';inUl=true} out+=`<li>${l.replace(/^\s*[-*•]\s/,'')}</li>`; }
    else if(l.trim()){ if(inUl){out+='</ul>';inUl=false} out+=`<p>${l}</p>`; }
  }
  if(inUl) out+='</ul>';
  return out;
}
async function askClaude(){
  if(!sampleApi) return;
  const out=$('#aiOut'), btn=$('#askAi');
  out.hidden=false; out.innerHTML='<p class="muted">Pensando no dia de vocês…</p>'; btn.disabled=true;
  const plan=buildPlan(), c=plan.c;
  const summary={
    data:`Ano ${st.year}, ${SEASONS[c.S]} dia ${c.D} (${WEEK[c.wd]})`, clima:WEATHER[st.weather], amanha:st.forecast?WEATHER[st.forecast]:'desconhecido', sorte:LUCK[st.luck],
    jogadores:st.players.map(p=>({nome:p.name,cultivo:p.farming,mineracao:p.mining,coleta:p.foraging,pesca:p.fishing,combate:p.combat})), andar_minas:st.mine, equipamentos:st.players.map(pl=>({nome:pl.name,...Object.fromEntries(TOOLS.map(([k,l,lv])=>[l,lv[(pl.tools||{})[k]||0]]))})),
    fazenda:st.farm, liberado:st.unl, festivais_hoje:plan.fests.map(f=>f[3]), aniversario:plan.bday||null,
    salas_completas:ROOMS.filter(roomDone).map(r=>r.name),
    conjuntos_faltando:ROOMS.flatMap(r=>r.bundles.filter(b=>!bundleDone(b)).map(b=>`${b.name} (${bundleCount(b)}/${b.need}; faltam: ${b.items.filter((_,i)=>!st.cc[itemKey(b.id,i)]).map(i=>i.n).join(', ')})`)),
    itens_do_cc_possiveis_hoje:plan.cc.filter(x=>x.ok!==false).slice(0,8).map(x=>`${x.it.n} (${x.it.h})`),
    missoes_sugeridas:plan.missions.map((m,i)=>m&&`${st.players[i].name}: ${m.goal}`),
    tarefas:plan.tasks.map(t=>t.t.replace(/<[^>]+>/g,'')),
    plantar_para_conjuntos:plan.plants.cc.map(p=>`${p.n} (${p.bundle.b.name})`), plantar_para_dinheiro:plan.plants.money.map(p=>`${p.n} (lucro ~${p.profit}g)`)
  };
  const prompt=`Você é um amigo experiente em Stardew Valley (versão 1.6, Nintendo Switch) ajudando um casal de iniciantes que joga em tela dividida (co-op local).
Com base no estado abaixo, escreva o plano do dia deles em português do Brasil, com tom leve e direto. Seja específico ao jogo (lugares, horários, itens). Não invente dados que contradigam o estado.
Formato (texto simples, sem tabelas):
## Manhã (6h–9h)
- 2 a 4 itens
## ${st.players[0].name}
- 3 a 4 itens
## ${st.players[1].name}
- 3 a 4 itens
## Antes de dormir
- 1 a 2 itens
## Dica do dia
Uma frase com uma dica útil para iniciantes ligada à situação de hoje.
Máximo de 230 palavras.

ESTADO:
${JSON.stringify(summary,null,1)}`;
  try{
    aiCtl=new AbortController();
    const r=await sampleApi(prompt,{signal:aiCtl.signal,onText:({text})=>{aiText=text;out.innerHTML=md(text)}});
    aiText=r.text; out.innerHTML=md(r.text);
  }catch(e){
    const code=e&&e.code;
    if(code==='not_granted'){ $('#aiCard').hidden=true; }
    else out.innerHTML=`<p>${code==='rate_limited'?'Muitos pedidos seguidos. Esperem um pouco e tentem de novo.':'Não foi possível montar o plano agora. O plano automático acima continua valendo.'}</p>`;
  }finally{ btn.disabled=false; }
}

/* ---------- Salvamento ---------- */
function setSave(mode){
  saveMode=mode;
  const el=$('#saveState'); if(!el) return;
  el.textContent=syncCode?(syncStatus==='on'?'Sincronizado':syncStatus==='connecting'?'Conectando…':'Sem conexão: salvo neste aparelho'):(mode==='shared'?'Salvo para vocês dois':'Salvo neste aparelho');
}
function applyRemote(data){
  if(!data||!data.state) return;
  st=normalize(data.state); lsSet(st); render();
}

/* ---------- Sincronização com o Firebase ---------- */
const FB_CONFIG={apiKey:"AIzaSyClFdGdZ-bsMtESfzs7cHccjr66KbBZXv4",authDomain:"stardew-hoje.firebaseapp.com",projectId:"stardew-hoje",storageBucket:"stardew-hoje.firebasestorage.app",messagingSenderId:"51711711659",appId:"1:51711711659:web:4a7403dbd01fe969ce9aee"};
const SYNC_KEY=LS_KEY+'-sync';
let fbDb=null, fbDoc=null, fbUnsub=null, syncStatus='off', fbTimer=null;
const myRevs=new Set();
let syncCode=(()=>{try{return localStorage.getItem(SYNC_KEY)}catch(e){return null}})();
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc);});}
async function fbInit(){
  if(fbDb) return fbDb;
  if(!window.firebase){
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  }
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.firestore(app);
  return fbDb;
}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const b=new Uint8Array(20);crypto.getRandomValues(b);let c='';b.forEach(x=>c+=A[x%32]);return c.match(/.{4}/g).join('-');}
function cleanCode(t){const c=String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return c.length===20?c.match(/.{4}/g).join('-'):null;}
function setSync(v){ syncStatus=v; setSave(saveMode); }
function pushNow(){
  if(!fbDoc) return Promise.resolve();
  const rev=Math.random().toString(36).slice(2); myRevs.add(rev); if(myRevs.size>30) myRevs.delete(myRevs.values().next().value);
  return fbDoc.set({json:JSON.stringify(st),rev,at:Date.now()}).then(()=>setSync('on')).catch(()=>setSync('error'));
}
function schedulePush(){ if(!fbDoc) return; clearTimeout(fbTimer); fbTimer=setTimeout(pushNow,800); }
function remoteIncoming(d){
  let state; try{ state=JSON.parse(d.json); }catch(e){ return; }
  const data={state};
  const editing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#farmCol')&&Date.now()-lastEdit<4000;
  if(editing){ pendingRemote=data; return; }
  applyRemote(data);
}
function listen(){
  if(fbUnsub) fbUnsub();
  fbUnsub=fbDoc.onSnapshot(snap=>{
    setSync('on');
    if(!snap.exists) return;
    const d=snap.data();
    if(myRevs.has(d.rev)) return;
    remoteIncoming(d);
  },()=>setSync('error'));
}
async function syncStart(code,mode){
  setSync('connecting');
  try{
    const db=await fbInit();
    const ref=db.collection('fazendas').doc(code);
    if(mode==='join'){
      const snap=await ref.get();
      if(!snap.exists){ setSync('off'); return 'notfound'; }
      const state=JSON.parse(snap.data().json);
      st=normalize(state); lsSet(st);
    }
    fbDoc=ref; syncCode=code;
    try{localStorage.setItem(SYNC_KEY,code)}catch(e){}
    if(mode==='create') await pushNow();
    listen();
    setSync('on'); render();
    return 'ok';
  }catch(e){ setSync('error'); return 'error'; }
}
function syncStop(){
  if(fbUnsub) fbUnsub(); fbUnsub=null; fbDoc=null; syncCode=null; clearTimeout(fbTimer);
  try{localStorage.removeItem(SYNC_KEY)}catch(e){}
  setSync('off'); render();
}
async function createSync(){
  syncMsg('Criando…');
  const r=await syncStart(newCode(),'create');
  if(r==='ok'){ selectTab('fazenda'); syncMsg('Pronto. Agora, no outro aparelho, abram esta seção e digitem o código acima.','ok'); }
  else syncMsg('Não deu para conectar ao banco. Confiram a internet e se as regras do Firestore foram publicadas, e tentem de novo.','err');
}
async function joinSync(){
  const code=cleanCode(($('#joinCode')||{}).value);
  if(!code){ syncMsg('O código tem 20 letras e números, no formato XXXX-XXXX-XXXX-XXXX-XXXX. Confiram e tentem de novo.','err'); return; }
  syncMsg('Entrando…');
  const r=await syncStart(code,'join');
  if(r==='ok'){ selectTab('plano'); showToast(`Sincronizado: ${SEASONS[st.season]} ${st.day}, ano ${st.year}.`); }
  else if(r==='notfound') syncMsg('Não achei uma fazenda com esse código. Confiram as letras: o código foi criado no outro aparelho?','err');
  else syncMsg('Não deu para conectar ao banco. Confiram a internet e tentem de novo.','err');
}
function copyCode(){
  if(!syncCode) return;
  const ok=()=>syncMsg('Código copiado. Mandem para o outro aparelho.','ok');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(syncCode).then(ok,()=>syncMsg('Não deu para copiar sozinho: selecionem o código acima e copiem.','err'));
  else syncMsg('Selecionem o código acima e copiem.','err');
}
function shareCode(){ if(syncCode) navigator.share({title:'Código da fazenda',text:syncCode}).catch(()=>{}); }

(async function boot(){
  if(applyRewards().length) lsSet(st); // conjuntos que já estavam completos
  if(syncCode) syncStart(syncCode,'resume');
  try{ const t=sessionStorage.getItem(LS_KEY+'-tab'); if(t) selectTab(t); }catch(_){}
  render();
  if(!window.claude||!window.claude.use) return;
  claude.use('sample').then(s=>{ if(s){ sampleApi=s; const c=$('#aiCard'); if(c) c.hidden=false; } }).catch(()=>{});
  try{
    const db=await claude.use('db');
    if(!db) return;
    dbDoc=db.doc('fazenda/estado');
    let first=true;
    dbDoc.onSnapshot(snap=>{
      setSave('shared');
      if(!snap.exists){
        if(first && !st.example){ scheduleRemote(); }
        first=false; return;
      }
      first=false;
      const data=snap.data();
      if(data.rev && data.rev===myRev) return;
      const editing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#farmCol')&&Date.now()-lastEdit<4000;
      if(editing){ pendingRemote=data; return; }
      applyRemote(data);
    },()=>{ setSave('local'); });
  }catch(e){ setSave('local'); }
})();
</script>
